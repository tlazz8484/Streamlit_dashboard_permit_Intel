name: Full Data Fetch (Permits + Zoning + Policy)

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  fetch-all:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install sodapy pandas requests beautifulsoup4
      
      - name: Fetch permits
        run: python scripts/fetch_permits.py
      
      - name: Fetch zoning
        run: python scripts/fetch_zoning.py
      
      - name: Keyword search and alerts
        run: python scripts/keyword_search.py
      
      - name: Upload permits as artifact
        uses: actions/upload-artifact@v4
        with:
          name: permits_data_${{ github.run_id }}
          path: data/permits/
      
      - name: Upload zoning as artifact
        uses: actions/upload-artifact@v4
        with:
          name: zoning_data_${{ github.run_id }}
          path: data/zoning/
      
      - name: Upload alerts as artifact
        uses: actions/upload-artifact@v4
        with:
          name: alerts_data_${{ github.run_id }}
          path: data/keywords_index/
