name: Daily Permit Fetch

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install pandas sodapy
      
      - name: Run Data Fetcher
        run: python fetch_data.py  # <--- CHANGED THIS: Runs the backend script instead of dashboard.py
      
      - name: Commit any new data
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add data/permits.csv
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto update $(date +'%Y-%m-%d')"
          git push || true
