name: Full Data Fetch (Permits + Zoning + Policy)

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  fetch-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install sodapy pandas requests beautifulsoup4
      - run: python scripts/fetch_permits.py
      - run: python scripts/fetch_zoning.py
      - run: python scripts/keyword_search.py
      - name: Commit and push
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add data/
          git diff --quiet && git diff --staged --quiet || git commit -m "Daily fetch $(date +'%Y-%m-%d')"
          git push

          
